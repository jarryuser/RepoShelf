[package]
name = "reposhelf"
version = "0.1.0"
description = "Local Git repository dashboard"
edition = "2021"

[lib]
name = "reposhelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.0", features = [] }
tauri-plugin-dialog = "~2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8"
libc = "0.2"
toml = "1"
